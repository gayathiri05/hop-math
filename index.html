<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hop Math – Level 1</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦘</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>:root{--bg:#fff7ed;--card:#ffffff;--ink:#1e293b;--muted:#64748b;--line:#e2e8f0;--primary:#7c3aed;--primary2:#a78bfa;--good:#16a34a;--goodbg:#dcfce7;--bad:#dc2626;--badbg:#fee2e2;--p3:#22c55e;--p4:#3b82f6;--p5:#a855f7;--shadow:0 6px 0 rgba(30,41,59,.08),0 10px 24px rgba(30,41,59,.08)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Nunito","Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:var(--bg);background-image:radial-gradient(circle at 10% 10%,#fde68a55 0 120px,transparent 121px),radial-gradient(circle at 90% 30%,#c4b5fd55 0 160px,transparent 161px),radial-gradient(circle at 20% 90%,#99f6e455 0 140px,transparent 141px);background-attachment:fixed;min-height:100vh;font-size:18px;line-height:1.45}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:900px;margin:0 auto;padding:16px 16px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:26px;color:var(--primary)}
.brand .roo{font-size:38px;display:inline-block;animation:hop 2.4s ease-in-out infinite}
@keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-10px)}90%{transform:translateY(0)}}
.card{background:var(--card);border-radius:22px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
h1{font-size:30px;margin:0 0 6px}h2{font-size:22px;margin:0 0 12px}
.muted{color:var(--muted)}
.btn{border:none;border-radius:16px;padding:12px 20px;font-size:18px;font-weight:800;background:var(--primary);color:#fff;box-shadow:0 4px 0 #5b21b6;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #5b21b6}
.btn.alt{background:#fff;color:var(--primary);border:2px solid var(--primary2);box-shadow:0 4px 0 #ddd6fe}
.btn.green{background:#16a34a;box-shadow:0 4px 0 #166534}
.btn.orange{background:#f97316;box-shadow:0 4px 0 #c2410c}
.btn.small{padding:8px 14px;font-size:15px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:default}
.profiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.prof{border:none;border-radius:26px;padding:26px 16px;color:#fff;text-align:center;box-shadow:var(--shadow);font-size:18px}
.prof .av{font-size:64px;display:block}.prof .nm{font-size:30px;font-weight:900;display:block}
.prof.p0{background:linear-gradient(135deg,#f472b6,#a855f7)}.prof.p1{background:linear-gradient(135deg,#38bdf8,#22c55e)}
.tests{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tcard{border:3px solid var(--line);background:#fff;border-radius:18px;padding:14px 10px;text-align:center;font-size:16px;transition:transform .1s}
.tcard:hover{transform:translateY(-3px)}
.tcard .tn{font-size:22px;font-weight:900;display:block}
.tcard.done{border-color:#86efac;background:#f0fdf4}.tcard.prog{border-color:#fcd34d;background:#fffbeb}
.stars{font-size:20px;letter-spacing:2px}
.skill{display:grid;grid-template-columns:minmax(150px,210px) 1fr 54px;align-items:center;gap:10px;margin:8px 0;font-size:16px}
.bar{height:16px;background:#f1f5f9;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;border-radius:99px}
.pill{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:800;font-size:14px;color:#fff}
.weak{display:flex;flex-wrap:wrap;gap:10px}
.qhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.qnum{font-weight:900;font-size:20px}
.timer{font-variant-numeric:tabular-nums;font-weight:800;color:var(--muted)}
.qtext{font-size:22px;font-weight:700;margin:6px 0 12px}
.eq{font-size:30px;font-weight:900;color:var(--primary);text-align:center;margin:12px 0;letter-spacing:1px}
.qsvg{display:block;margin:10px auto 14px;width:100%;height:auto}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.ch{display:flex;align-items:center;gap:10px;border:3px solid var(--line);background:#fff;border-radius:18px;padding:12px 14px;font-size:22px;font-weight:800;color:var(--ink);text-align:left;min-height:64px}
.ch .lt{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;color:#fff;background:#94a3b8}
.ch:hover{border-color:var(--primary2)}
.ch.sel{border-color:var(--primary);background:#f5f3ff}.ch.sel .lt{background:var(--primary)}
.ch.right{border-color:var(--good);background:var(--goodbg)}.ch.right .lt{background:var(--good)}
.ch.wrong{border-color:var(--bad);background:var(--badbg)}.ch.wrong .lt{background:var(--bad)}
.ch .ico{flex:none}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.dots{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;margin-top:10px}
.dot{aspect-ratio:1;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:13px;font-weight:800;color:var(--muted);padding:0}
.dot.ans{background:#ede9fe;border-color:var(--primary2);color:var(--primary)}
.dot.cur{outline:3px solid var(--primary);outline-offset:1px}
.score{text-align:center}
.big{font-size:64px;font-weight:900;color:var(--primary);line-height:1}
.bigstars{font-size:44px;letter-spacing:6px}
table.pts{width:100%;border-collapse:collapse;font-size:17px}
table.pts td,table.pts th{padding:8px;border-bottom:1px solid var(--line);text-align:center}
table.pts th:first-child,table.pts td:first-child{text-align:left}
.rev{border-left:8px solid var(--line);padding:14px 16px;border-radius:16px;background:#fff;margin-bottom:12px;box-shadow:var(--shadow)}
.rev.ok{border-left-color:var(--good)}.rev.no{border-left-color:var(--bad)}.rev.skip{border-left-color:#f59e0b}
.rev .qtext{font-size:19px}
.expl{background:#fefce8;border:2px dashed #fde047;border-radius:14px;padding:12px 14px;margin-top:10px;font-size:17px}
.expl b{color:#7c2d12}
.feedback{margin-top:14px;border-radius:16px;padding:14px 16px;font-size:18px}
.feedback.ok{background:var(--goodbg)}.feedback.no{background:var(--badbg)}
.tag{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.confetti span{position:absolute;top:-40px;font-size:28px;animation:fall 2.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.foot{font-size:14px;color:var(--muted);text-align:center;margin-top:20px}
.linkbtn{background:none;border:none;color:var(--primary);font-weight:800;text-decoration:underline;font-size:15px;padding:4px}
@media (max-width:560px){body{font-size:17px}.qtext{font-size:20px}.ch{font-size:20px}.dots{grid-template-columns:repeat(8,1fr)}.skill{grid-template-columns:1fr 1fr 46px}.big{font-size:52px}h1{font-size:26px}}
</style></head>
<body><div class="wrap" id="app"></div>
<script>/* Kangaroo-style Level 1 question generator (original questions). */
(function (root) {
"use strict";
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1));
const pick=(r,a)=>a[Math.floor(r()*a.length)];
function shuffle(r,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const NAMES=["Mia","Leo","Ava","Sam","Zoe","Max","Lily","Ben","Nora","Eli","Ruby","Omar","Anya","Ravi","Ella","Theo","Maya","Kai"];
const ITEMS=["apples","stickers","marbles","shells","crayons","cookies","balloons","acorns","buttons","toy cars"];
const names=(r,n)=>shuffle(r,NAMES).slice(0,n);
const plural=(n,w)=>n+" "+(n===1?w.replace(/s$/,""):w);

function numChoices(r,correct,extra){
  const seen=new Set([correct]),out=[];
  for(const e of extra||[]){if(Number.isInteger(e)&&e>=0&&!seen.has(e)){seen.add(e);out.push(e);}if(out.length===4)break;}
  let spread=Math.max(2,Math.ceil(correct*0.2)),guard=0;
  while(out.length<4&&guard++<500){const c=correct+(r()<0.5?-1:1)*ri(r,1,spread);if(c>=0&&!seen.has(c)){seen.add(c);out.push(c);}if(guard%20===0)spread++;}
  const all=out.concat([correct]).sort((a,b)=>a-b);
  return {choices:all.map(String),answer:all.indexOf(correct)};
}
function textChoices(r,correct,distractors,keepOrder){
  const d=[...new Set(distractors.filter(x=>x!==correct))];
  const ds=keepOrder?d.slice(0,4):shuffle(r,d).slice(0,4);
  const all=keepOrder?ds.concat([correct]):shuffle(r,ds.concat([correct]));
  if(keepOrder) all.sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true}));
  return {choices:all,answer:all.indexOf(correct)};
}

/* ---------- SVG helpers ---------- */
const PAL={red:"#ef4444",blue:"#3b82f6",green:"#22c55e",yellow:"#facc15",purple:"#8b5cf6"};
const PALV=Object.values(PAL);
function starPts(cx,cy,R,r0){let p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r0:R;p.push((cx+rr*Math.cos(a)).toFixed(1)+","+(cy+rr*Math.sin(a)).toFixed(1));}return p.join(" ");}
function shape(t,c,x,y,s){const h=s/2;
  if(t==="circle")return `<circle cx="${x}" cy="${y}" r="${h}" fill="${c}"/>`;
  if(t==="square")return `<rect x="${x-h}" y="${y-h}" width="${s}" height="${s}" rx="3" fill="${c}"/>`;
  if(t==="triangle")return `<polygon points="${x},${y-h} ${x-h},${y+h} ${x+h},${y+h}" fill="${c}"/>`;
  if(t==="star")return `<polygon points="${starPts(x,y,h,h*0.45)}" fill="${c}"/>`;
  if(t==="diamond")return `<polygon points="${x},${y-h} ${x+h},${y} ${x},${y+h} ${x-h},${y}" fill="${c}"/>`;
  return "";}
const icon=(t,c)=>`<svg class="ico" viewBox="0 0 40 40" width="44" height="44">${shape(t,c,20,20,32)}</svg>`;
function svgWrap(w,h,body){return `<svg class="qsvg" viewBox="0 0 ${w} ${h}" style="max-width:${Math.min(w*1.4,520)}px">${body}</svg>`;}
function rowSVG(items,q){const n=items.length+(q?1:0),w=n*50+10;let b="";items.forEach((it,i)=>b+=shape(it.t,it.c,30+i*50,30,36));
  if(q){const x=30+items.length*50;b+=`<rect x="${x-20}" y="10" width="40" height="40" rx="8" fill="#fff" stroke="#94a3b8" stroke-dasharray="4 3" stroke-width="2"/><text x="${x}" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#64748b">?</text>`;}
  return svgWrap(w,60,b);}
function objectsSVG(n,t,c,per){per=per||6;const rows=Math.ceil(n/per),w=per*46+10,h=rows*46+10;let b="";for(let i=0;i<n;i++)b+=shape(t,c,28+(i%per)*46,28+Math.floor(i/per)*46,36);return svgWrap(w,h,b);}
function mixedSVG(r,types){const cols=5,cells=shuffle(r,[...Array(15).keys()]).slice(0,types.length);let b="";
  types.forEach((t,i)=>{const k=cells[i],x=34+(k%cols)*62+ri(r,-6,6),y=34+Math.floor(k/cols)*62+ri(r,-6,6);b+=shape(t,pick(r,PALV),x,y,ri(r,30,42));});
  return svgWrap(cols*62+10,3*62+10,b);}
function gridSVG(rows,cols){const s=40,w=cols*s+20,h=rows*s+20;let b=`<rect x="10" y="10" width="${cols*s}" height="${rows*s}" fill="#e0f2fe"/>`;
  for(let i=0;i<=rows;i++)b+=`<line x1="10" y1="${10+i*s}" x2="${10+cols*s}" y2="${10+i*s}" stroke="#0369a1" stroke-width="2.5"/>`;
  for(let j=0;j<=cols;j++)b+=`<line x1="${10+j*s}" y1="10" x2="${10+j*s}" y2="${10+rows*s}" stroke="#0369a1" stroke-width="2.5"/>`;return svgWrap(w,h,b);}
function fanSVG(k){const A=[110,12],L=[12,150],R=[208,150];let b=`<polygon points="${A} ${L} ${R}" fill="#fef3c7" stroke="#b45309" stroke-width="3" stroke-linejoin="round"/>`;
  for(let i=1;i<=k;i++){const x=L[0]+(R[0]-L[0])*i/(k+1);b+=`<line x1="${A[0]}" y1="${A[1]}" x2="${x}" y2="150" stroke="#b45309" stroke-width="3"/>`;}return svgWrap(220,162,b);}
function cube(x,y,s,c){return `<rect x="${x}" y="${y}" width="${s}" height="${s}" rx="3" fill="${c}" stroke="#1e293b" stroke-width="2"/>`;}
function stacksSVG(r,hs){const s=34,H=Math.max(...hs),w=hs.length*(s+14)+10,h=H*s+20;let b=`<line x1="0" y1="${h-8}" x2="${w}" y2="${h-8}" stroke="#64748b" stroke-width="3"/>`;
  hs.forEach((ht,i)=>{const c=PALV[i%PALV.length];for(let j=0;j<ht;j++)b+=cube(10+i*(s+14),h-8-(j+1)*s,s,c);});return svgWrap(w,h,b);}
function stairsSVG(n){const s=30,w=n*s+20,h=n*s+20;let b="";for(let i=0;i<n;i++)for(let j=0;j<=i;j++)b+=cube(10+i*s,h-10-(j+1)*s,s,"#fb923c");return svgWrap(w,h,b);}
function clockSVG(h,m){let b=`<circle cx="80" cy="80" r="72" fill="#fff" stroke="#7c3aed" stroke-width="6"/>`;
  for(let i=1;i<=12;i++){const a=(i*30-90)*Math.PI/180;b+=`<text x="${(80+56*Math.cos(a)).toFixed(1)}" y="${(86+56*Math.sin(a)).toFixed(1)}" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">${i}</text>`;}
  const ha=((h%12)+m/60)*30-90,ma=m*6-90,rad=d=>d*Math.PI/180;
  b+=`<line x1="80" y1="80" x2="${(80+34*Math.cos(rad(ha))).toFixed(1)}" y2="${(80+34*Math.sin(rad(ha))).toFixed(1)}" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>`;
  b+=`<line x1="80" y1="80" x2="${(80+54*Math.cos(rad(ma))).toFixed(1)}" y2="${(80+54*Math.sin(rad(ma))).toFixed(1)}" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/><circle cx="80" cy="80" r="5" fill="#0f172a"/>`;
  return svgWrap(160,160,b);}
function matchSVG(n){const s=46,w=n*s+20,h=s+20;let b="";const st=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#d97706" stroke-width="6" stroke-linecap="round"/>`;
  for(let i=0;i<n;i++){const x=10+i*s;b+=st(x+4,10,x+s-4,10)+st(x+4,10+s,x+s-4,10+s);}for(let i=0;i<=n;i++){const x=10+i*s;b+=st(x,14,x,s+6);}return svgWrap(w,h,b);}

const SHAPES=["circle","square","triangle","star","diamond"];
const SHAPE_NAME={circle:"circle",square:"square",triangle:"triangle",star:"star",diamond:"diamond"};
const COLOR_NAME=Object.fromEntries(Object.entries(PAL).map(([k,v])=>[v,k]));
const itemName=it=>COLOR_NAME[it.c]+" "+SHAPE_NAME[it.t];
const itemKey=it=>it.t+"|"+it.c;
function shapeChoices(r,correct,pool){const keys=new Set([itemKey(correct)]),ds=[];for(const p of shuffle(r,pool)){if(!keys.has(itemKey(p))){keys.add(itemKey(p));ds.push(p);}if(ds.length===4)break;}
  while(ds.length<4){const p={t:pick(r,SHAPES),c:pick(r,PALV)};if(!keys.has(itemKey(p))){keys.add(itemKey(p));ds.push(p);}}
  const all=shuffle(r,ds.concat([correct]));return {choices:all.map(p=>icon(p.t,p.c)),answer:all.findIndex(p=>itemKey(p)===itemKey(correct)),labels:all.map(itemName)};}

const DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const fmt=(h,m)=>h+":"+String(m).padStart(2,"0");
const ord=n=>n+(n%100>=11&&n%100<=13?"th":({1:"st",2:"nd",3:"rd"}[n%10]||"th"));

/* ---------- Templates: CAT -> difficulty(1..3) -> [fn] ---------- */
const T={};

/* NUMBERS & COUNTING */
T.numbers={1:[
 r=>{const k=ri(r,7,16),per=6,rows=[];for(let i=0;i<k;i+=per)rows.push(Math.min(per,k-i));const c=pick(r,PALV);
   return {text:"How many stars are in the picture?",svg:objectsSVG(k,"star",c,per),...numChoices(r,k,[k-1,k+1,k+2,k-2]),
   explain:`Count row by row so you don't miss any:<br>${rows.map((n,i)=>`Row ${i+1}: ${n} stars`).join("<br>")}<br>Add them: ${rows.join(" + ")} = <b>${k}</b>.`};},
 r=>{const N=ri(r,12,79);return {text:`What number is 10 more than ${N}?`,...numChoices(r,N+10,[N+1,N+11,N+9,N+20,N-10]),
   explain:`Adding 10 makes the <b>tens digit</b> go up by 1. The ones digit stays the same.<br>${N} has ${Math.floor(N/10)} tens and ${N%10} ones → ${Math.floor(N/10)+1} tens and ${N%10} ones = <b>${N+10}</b>.`};},
 r=>{let N=ri(r,21,98);if(N%10===Math.floor(N/10))N++;const t=Math.floor(N/10),o=N%10;
   return {text:`How many tens are in the number ${N}?`,...numChoices(r,t,[o,t+1,t-1,t+2,o+1]),
   explain:`In ${N}, the <b>left digit</b> tells the tens and the right digit tells the ones.<br>${N} = ${t} tens + ${o} ones (${t*10} + ${o}).<br>So there are <b>${t}</b> tens.`};}
],2:[
 r=>{const A=ri(r,3,25),B=A+ri(r,7,16),[n]=names(r,1),ans=B-A+1;
   return {text:`${n} writes down all the numbers from ${A} to ${B}. How many numbers does ${n} write?`,...numChoices(r,ans,[B-A,B-A+2,B-A-1]),
   explain:`${B} − ${A} = ${B-A}, but that misses one number! We must count <b>both</b> ${A} and ${B}, so add 1: ${B-A} + 1 = <b>${ans}</b>.<br>Check with a small example: 1 to 3 is 1, 2, 3 → 3 numbers, and 3 − 1 + 1 = 3.`};},
 r=>{const d=shuffle(r,[1,2,3,4,5,6,7,8,9]).slice(0,3),s=d.slice().sort((a,b)=>b-a),ans=s[0]*10+s[1];
   return {text:`Using two of the digits ${d.join(", ")} (each digit at most once), what is the biggest two-digit number you can make?`,
   ...numChoices(r,ans,[s[0]*10+s[2],s[1]*10+s[0],s[2]*10+s[0],s[1]*10+s[2]]),
   explain:`To make the biggest number, put the <b>biggest digit in the tens place</b>: ${s[0]}.<br>Then put the next biggest digit in the ones place: ${s[1]}.<br>Answer: <b>${ans}</b>.`};},
 r=>{const N=ri(r,11,30),ans=Math.floor(N/2);
   return {text:`How many even numbers are there from 1 to ${N}?`,...numChoices(r,ans,[Math.ceil(N/2)===ans?ans+1:Math.ceil(N/2),ans-1,N-ans+2,ans+2]),
   explain:`Even numbers end in 0, 2, 4, 6 or 8: they are every other number.<br>${Array.from({length:ans},(_,i)=>2*(i+1)).join(", ")}<br>That is <b>${ans}</b> even numbers.`};}
],3:[
 r=>{let N,D,list;do{N=ri(r,3,9)*10;D=ri(r,1,Math.min(9,N/10));list=[];for(let i=1;i<=N;i++)if(String(i).includes(String(D)))list.push(i);}while(list.length<4);
   const ones=list.filter(x=>x%10===D).length,occ=list.reduce((s,x)=>s+String(x).split("").filter(c=>c===String(D)).length,0);
   return {text:`How many of the numbers from 1 to ${N} have the digit ${D} in them?`,...numChoices(r,list.length,[ones,occ,list.length-1,list.length+1]),
   explain:`List them carefully, looking at the ones place AND the tens place:<br>${list.join(", ")}<br>That is <b>${list.length}</b> numbers.`+(list.includes(D*11)?`<br>Careful: ${D*11} has the digit ${D} twice, but it is still only one number.`:"")};},
 r=>{let t,u;do{t=ri(r,3,9);u=ri(r,0,t-2);}while(t+u>17);const s=t+u,df=t-u,ans=10*t+u;
   return {text:`I am a two-digit number. My two digits add up to ${s}. My tens digit is ${df} more than my ones digit. What number am I?`,...numChoices(r,ans,[10*u+t,10*t+u+1,10*(t-1)+u+1,10*(t+1)+u-1].filter(x=>x>9&&x<100)),

  if(un&&!confirm(`You still have ${un} question${un>1?"s":""} without an answer. Wrong answers don't lose points, so it's smart to guess!\n\nFinish the test anyway?`))return;
  stopTimer();const answers=qs.map((_,i)=>ip.answers[i]!=null?ip.answers[i]:null),g=grade(qs,answers),p=P();
  p.attempts[n]=p.attempts[n]||[];p.attempts[n].push({date:new Date().toISOString(),score:g.score,answers,time:ip.elapsed});delete p.inProgress[n];save();
  showResults(n,p.attempts[n].length-1,true);}

function showResults(n,ai,fresh){stopTimer();const p=P(),att=p.attempts[n][ai],qs=makeTest(n),g=grade(qs,att.answers),pc=pct(g.score,MAX),st=starsFor(pc);
  const msg=pc>=85?"Amazing! You're a math superstar! 🌟":pc>=65?"Great job! You're hopping high! 🦘":pc>=40?"Good effort! Practice makes you stronger! 💪":"Nice try! Let's practice together and grow! 🌱";
  const weakHere=CAT_KEYS.filter(c=>g.byCat[c]&&g.byCat[c][0]/g.byCat[c][1]<0.7).sort((a,b)=>g.byCat[a][0]/g.byCat[a][1]-g.byCat[b][0]/g.byCat[b][1]);
  const hist=p.attempts[n].length>1?`<p class="muted" style="font-size:15px">Tries on this test: ${p.attempts[n].map((a,k)=>k===ai?`<b>${a.score}</b>`:a.score).join(" → ")}</p>`:"";
  app().innerHTML=header()+`<div class="card score"><div class="tag">Test ${n} results</div><div style="font-size:60px">${pc>=65?"🏆":"🦘"}</div>
   <div class="big">${g.score}<span style="font-size:30px;color:var(--muted)"> / ${MAX}</span></div><div class="bigstars">${starStr(st)}</div>
   <h2 style="margin:8px 0 4px">${msg}</h2><p class="muted" style="margin:0">${g.correct} of 24 correct · Time ${fmtTime(att.time)}</p>${hist}</div>
  <div class="card"><h2>🧮 How your score was counted</h2><table class="pts"><tr><th>Question type</th><th>Correct</th><th>Points each</th><th>Points earned</th></tr>
   ${[3,4,5].map(k=>`<tr><td><span class="pill" style="background:var(--p${k})">${k}-point</span> (questions ${k===3?"1–8":k===4?"9–16":"17–24"})</td><td>${g.byPts[k][0]} of 8</td><td>${k}</td><td><b>${g.byPts[k][0]*k}</b> of ${8*k}</td></tr>`).join("")}
   <tr><td><b>Total</b></td><td><b>${g.correct} of 24</b></td><td></td><td><b>${g.score}</b> of ${MAX}</td></tr></table>
   <p class="muted" style="font-size:15px">Harder questions are worth more points. Stars: ⭐⭐⭐ 85% or more (82+ points), ⭐⭐ 65% or more (63+), ⭐ 40% or more (39+).</p></div>
  <div class="card"><h2>📊 Skills in this test</h2>${CAT_KEYS.filter(c=>g.byCat[c]).map(c=>{const [a,b]=g.byCat[c];return `<div class="skill"><span>${CATS[c].emoji} ${CATS[c].name}</span><div class="bar"><i style="width:${pct(a,b)}%;background:${CATS[c].color}"></i></div><b>${a}/${b}</b></div>`;}).join("")}
   ${weakHere.length?`<h2 style="margin-top:16px">🎯 Let's practice</h2><p>You can get stronger at these. Each practice gives you 10 new questions with help after every answer.</p><div class="weak">${weakHere.map(c=>`<button class="btn orange" data-prac="${c}">${CATS[c].emoji} ${CATS[c].name}</button>`).join("")}</div>`:`<p style="margin-top:12px">🎉 No weak spots in this test. Fantastic!</p>`}</div>
  <div class="card"><h2>🔍 Check every answer</h2><div class="row"><button class="btn alt small" data-filter="wrong">Show only mistakes</button><button class="btn alt small" data-filter="all">Show all</button></div></div>
  <div id="review">${qs.map((q,i)=>{const a=att.answers[i],ok=a===q.answer,cls=a==null?"skip":ok?"ok":"no";
    return `<div class="rev ${cls}" data-ok="${ok?1:0}"><div class="qhead"><span class="qnum">${ok?"✅":a==null?"⚪":"❌"} Question ${i+1}</span><span><span class="pill" style="background:${CATS[q.cat].color}">${CATS[q.cat].emoji} ${CATS[q.cat].name}</span> <span class="pill" style="background:var(--p${q.pts})">${q.pts} pts</span></span></div>
     <div class="qtext">${q.text}</div>${q.svg||""}<div class="choices">${q.choices.map((_,k)=>choiceHTML(q,k,k===q.answer?"right":k===a?"wrong":"")).join("")}</div>
     <p style="margin:10px 0 0"><b>Your answer:</b> ${esc(answerLabel(q,a))}${ok?"":` · <b>Correct:</b> ${esc(answerLabel(q,q.answer))}`}</p>
     <div class="expl">💡 <b>How to solve it:</b><br>${q.explain}</div></div>`;}).join("")}</div>
  <div class="card row" style="justify-content:center"><button class="btn" data-retry="${n}">🔄 Try Test ${n} again</button>${n<NUM_TESTS?`<button class="btn green" data-test="${n+1}">Next: Test ${n+1} ➡</button>`:""}<button class="btn alt" data-act="home">🏠 Home</button></div>`;
  window.scrollTo({top:0});if(fresh&&pc>=65)confetti();}

/* --- practice --- */
let PR=null;
function startPractice(cat){stopTimer();PR={cat,qs:makePractice(cat,Date.now()%1e9),i:0,picked:null,right:0};renderP();}
function renderP(){const {cat,qs,i,picked}=PR,q=qs[i],done=picked!=null,ok=picked===q.answer;
  app().innerHTML=header()+`<div class="card"><div class="qhead"><span class="qnum">${CATS[cat].emoji} ${CATS[cat].name} practice · ${i+1} of ${qs.length}</span><span class="pill" style="background:var(--p${q.pts})">${["","Easy","Medium","Tricky"][q.d]}</span></div>
   <div class="bar" style="margin-bottom:14px"><i style="width:${pct(i,qs.length)}%;background:${CATS[cat].color}"></i></div>
   <div class="qtext">${q.text}</div>${q.svg||""}
   <div class="choices">${q.choices.map((_,k)=>choiceHTML(q,k,done?(k===q.answer?"right":k===picked?"wrong":""):"")).join("")}</div>
   ${done?`<div class="feedback ${ok?"ok":"no"}"><b>${ok?"🎉 Correct! Great thinking!":"🤔 Not quite. The answer is "+esc(answerLabel(q,q.answer))+"."}</b><div class="expl">💡 <b>How to solve it:</b><br>${q.explain}</div></div>
   <div class="nav"><span class="muted">Score so far: ${PR.right}/${i+1}</span><button class="btn" data-act="pnext">${i<qs.length-1?"Next ➡":"See my result 🏁"}</button></div>`:`<p class="muted" style="font-size:15px;margin-bottom:0">Tap an answer. You'll see the explanation right away.</p>`}</div>`;
  if(done)$(".feedback").scrollIntoView({behavior:"smooth",block:"nearest"});else window.scrollTo({top:0});}
function pickP(k){if(PR.picked!=null)return;PR.picked=k;const ok=k===PR.qs[PR.i].answer;if(ok)PR.right++;
  const s=P().practice;s[PR.cat]=s[PR.cat]||[0,0];s[PR.cat][1]++;if(ok)s[PR.cat][0]++;save();renderP();}
function nextP(){if(PR.i<PR.qs.length-1){PR.i++;PR.picked=null;renderP();return;}
  const {cat,right,qs}=PR,pc=pct(right,qs.length),stats=skillStats()[cat];
  app().innerHTML=header()+`<div class="card score"><div style="font-size:60px">${pc>=70?"🌟":"💪"}</div><div class="big">${right}<span style="font-size:30px;color:var(--muted)"> / ${qs.length}</span></div>
   <h2>${pc>=90?"Wow, you mastered it!":pc>=70?"Great practice!":"Good work! Every try makes your brain stronger."}</h2>
   <p class="muted">${CATS[cat].emoji} ${CATS[cat].name}: overall skill is now <b>${pct(...stats)}%</b></p>
   <div class="row" style="justify-content:center"><button class="btn orange" data-prac="${cat}">🔁 10 more questions</button><button class="btn alt" data-act="home">🏠 Home</button></div></div>`;
  if(pc>=70)confetti();}

/* ---------- events ---------- */
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.kid){DB.current=d.kid;save();screenHome();return;}
  if(d.act==="home"){if(T&&timerId)save();screenHome();return;}
  if(d.act==="switch"){save();screenProfiles();return;}
  if(d.act==="export"){const blob=new Blob([JSON.stringify(DB,null,1)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="hop-math-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();return;}
  if(d.test){openTest(+d.test);return;}
  if(d.retry){P().inProgress[d.retry]={answers:{},idx:0,elapsed:0};save();startTest(+d.retry);return;}
  if(d.prac){startPractice(d.prac);return;}
  if(d.filter){document.querySelectorAll("#review .rev").forEach(r=>r.style.display=d.filter==="wrong"&&r.dataset.ok==="1"?"none":"");return;}
  if(d.act==="pnext"){nextP();return;}
  if(d.ch!=null){if(PR&&$(".qnum")&&$(".qnum").textContent.includes("practice")){pickP(+d.ch);return;}
    if(T&&!b.closest(".rev")){T.ip.answers[T.ip.idx]=+d.ch;save();renderQ();}return;}
  if(!T)return;
  if(d.act==="prev"){T.ip.idx--;save();renderQ();}
  else if(d.act==="next"){T.ip.idx++;save();renderQ();}
  else if(d.go!=null){T.ip.idx=+d.go;save();renderQ();}
  else if(d.act==="finish")finishTest();
});
document.addEventListener("change",e=>{if(e.target.id!=="imp")return;const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!x.profiles)throw 0;if(!confirm("Replace the progress on this device with the backup?"))return;DB=x;load2();save();screenProfiles();alert("Backup restored! ✅");}catch(err){alert("Sorry, that file doesn't look like a Hop Math backup.");}};rd.readAsText(f);});
function load2(){KIDS.forEach(k=>{if(!DB.profiles[k.name])DB.profiles[k.name]={attempts:{},practice:{},inProgress:{}};});}
window.addEventListener("beforeunload",save);

load();if(DB.current&&DB.profiles[DB.current])screenHome();else screenProfiles();
})();
</script>
</body></html>
